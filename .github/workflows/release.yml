name: Release

on:
  push:
    tags: ['rules-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Date-based Rules version
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          value="$INPUT_VERSION"
          if [[ -z "$value" ]]; then value="${REF_NAME#rules-v}"; fi
          [[ "$value" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]
          printf 'value=%s\n' "$value" >> "$GITHUB_OUTPUT"
      - run: python3 scripts/validate.py
      - run: python3 scripts/build.py --version '${{ steps.version.outputs.value }}' --output dist
      - name: Validate nuclei templates with pinned engine
        run: |
          curl -fsSLo nuclei.zip https://github.com/projectdiscovery/nuclei/releases/download/v3.11.1/nuclei_3.11.1_linux_amd64.zip
          printf '%s  %s\n' ea63d4ae232808cd7c6bc00d0142428e231fab59dae01042246097d195835ab6 nuclei.zip | sha256sum --check --status
          unzip -q nuclei.zip nuclei
          mkdir extracted
          zstd -dc "dist/argus-rules_${{ steps.version.outputs.value }}.tar.zst" | tar -xf - -C extracted
          ./nuclei -validate -duc -nc -allow-local-file-access -t extracted/templates
          sha256sum --check dist/SHA256SUMS
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: rules-release
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: rules-release
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "ARGUS Rules ${GITHUB_REF_NAME#rules-v}" --notes "Curated immutable ARGUS Rules release with source, license, validation, statistics, SBOM, and provenance records."
        env:
          GH_TOKEN: ${{ github.token }}

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 scripts/validate.py
      - run: python3 -m py_compile scripts/*.py
      - run: '! grep -RIE "(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|gh[opsu]_[A-Za-z0-9_]{20,})" --exclude-dir=.git .'
      - run: python3 scripts/build.py --version 2026.09.03.0 --output dist
      - run: (cd dist && sha256sum --check SHA256SUMS)
